<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GSAP Cube Rotation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Rubik Mono One', monospace;
      perspective: 900px;
    }

    .texto {
      font-size: 3rem;
      letter-spacing: 0.1em;
      color: #fff;
      white-space: nowrap;
    }

    .char {
      display: inline-block;
      transform-style: preserve-3d;
    }
  </style>
</head>
<body>

<div class="texto">NUEVO DISEÑO</div>

<script>
  const text = document.querySelector(".texto");
  const chars = [...text.textContent];

  text.textContent = "";

  chars.forEach((c, i) => {
    const span = document.createElement("span");
    span.className = "char";
    span.textContent = c === " " ? "\u00A0" : c;

    span.style.transformOrigin =
      i % 2 === 0 ? "50% 100%" : "50% 0%";

    text.appendChild(span);
  });

  // entrada
  gsap.fromTo(".char",
    {
      rotationX: (i) => i % 2 === 0 ? -90 : 90,
      opacity: 0
    },
    {
      rotationX: 0,
      opacity: 1,
      duration: 0.9,
      ease: "power3.out",
      stagger: 0.12
    }
  );

  // salida + redirect
  setTimeout(() => {
    gsap.to(".char", {
      rotationX: (i) => i % 2 === 0 ? 90 : -90,
      opacity: 0,
      duration: 0.8,
      ease: "power3.in",
      stagger: 0.08,
      onComplete: () => {
        window.location.href = "https://lapicadelaaraña.cl";
      }
    });
  }, 2000);
</script>


</body>
</html>
